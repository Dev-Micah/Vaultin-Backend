spring:
  application:
    name: vaultin

  datasource:
    url: jdbc:postgresql://localhost:5432/vaultin_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

    jpa:
      hibernate:
        # NEVER use 'update' in production for a wallet. Let Flyway handle schemas.
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true

    jwt:
      secret: "VaultinSuperSecretKeyThatIsAtLeast32CharactersLong2026!"

    flyway:
      enabled: true
      baseline-on-migrate: true
      locations: classpath:db/migration

    logging:
    level:
    org.springframework.r2dbc: DEBUG
    org.flywaydb: INFO